apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-0-6b
  namespace: ai-grid-internal-models
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  baseRefs:
    - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    uri: hf://Qwen/Qwen3-0.6B
    name: qwen3-0-6b
  replicas: 2
  router:
    scheduler:
      template:
        containers:
          - name: main
            args:
              - --metrics-cert-dir=/var/run/kserve/tls
    route: { }
    gateway:
      refs:
        - name: openshift-ai-inference
          namespace: openshift-ingress
  template:
    volumes:
      - name: kv-cache
        emptyDir: {}
    containers:
      - name: pvc-evictor
        volumeMounts:
          - name: kv-cache
            mountPath: /kv-cache
          - name: kv-cache
            mountPath: /kv-cache/kv/model-cache/models
            subPath: models
      - name: main
        args:
          - --max-model-len=2048
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
        resources:
          limits:
            cpu: '4'
            memory: 16Gi
          requests:
            cpu: '2'
            memory: 12Gi
